server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    error_page 404 /404.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    set $cache_policy "public, max-age=300";
    add_header Cache-Control $cache_policy always;
    location / { try_files $uri $uri/ =404; }
    location /vi/ { error_page 404 /vi/404/index.html; try_files $uri $uri/ =404; }
    location /_astro/ {
        set $cache_policy "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;
}
